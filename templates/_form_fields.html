{% if form.non_field_errors %}<div class="alert alert-error">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-grid">
{% for f in form %}
  <div class="field{% if f.field.widget.attrs.rows %} full{% endif %}">
    <label for="{{ f.id_for_label }}">{{ f.label }}</label>
    {{ f }}
    {% if f.help_text %}<span class="file-hint">{{ f.help_text|safe }}</span>{% endif %}
    {% for e in f.errors %}<span class="err">{{ e }}</span>{% endfor %}
  </div>
{% endfor %}
</div>
